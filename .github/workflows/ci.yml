# Tests on every push and pull request; deploys to GitHub Pages from main.
# Repository setting required once: Settings -> Pages -> Source: "GitHub Actions".
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # Parity with the Python reference, via the committed goldens (fails if they are stale).
      - run: npm test

      # Project page: served from https://<owner>.github.io/<repo>/
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
